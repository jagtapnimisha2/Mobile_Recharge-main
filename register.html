<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
   <link rel="stylesheet" href="css/css2/register.css">
</head>
<body style="background-color: #3a4f9c68;">
    <div class="container-fluid">
        <div class="row reg-form">
            <div class="col-md-6 register-img">
                <img src="images/main-folder/register.jpg" alt="">
            </div>
            <div class="col-md-6 register-form">
                <div class="logo">
                    <img src="images/login-logo.png" alt="">
                </div>
                <p class="text-center">Please register into new account</p>
                <form>
                    <select class="dropdown">
                        <option>Select Role</option>
                        <option>API Partner</option>
                        <option>Master Distributor</option>
                        <option>Distributor</option>
                        <option>Retailer</option>
                    </select>
                    <div class="outlet mt-3">
                        <i class="fa-regular fa-keyboard"></i>
                        <input class="form-control" type="text" placeholder="Outlet Name">
                    </div>
                    <div class="firstname mt-3">
                        <i class="fa-regular fa-user"></i>
                        <input class="form-control" type="text" placeholder="First Name">
                    </div>
                    <div class="Middelname mt-3">
                        <i class="fa-regular fa-user"></i>
                        <input class="form-control" type="text" placeholder="Middle Name">
                    </div>
                    <div class="Lastname mt-3">
                        <i class="fa-regular fa-user"></i>
                        <input class="form-control" type="text" placeholder="Last Name">
                    </div>
                    <div class="mobileNo mt-3">
                        <i class="fa-solid fa-mobile"></i>
                        <input class="form-control" type="number" placeholder="Mobile Number">
                    </div>
                    <div class="email mt-3">
                        <i class="fa-regular fa-envelope"></i>
                        <input class="form-control" type="text" placeholder="Email Address">
                    </div>
                    <div class="location mt-3">
                        <i class="fa-solid fa-location-dot"></i>
                        <input class="form-control" type="text" placeholder="City">
                    </div>
                    <div class="registerBtn mt-4">
                       <button style="background-color:  rgba(72, 44, 191, 1) 0%, rgba(106, 198, 240, 1)" class="btn btn-primary w-100">Register Now</button>
                    </div>
                   <div class="accountLink text-center mt-3">
                    <a  href="">Already have your account?</a>
                   </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
