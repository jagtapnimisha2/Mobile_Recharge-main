<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
   <link rel="stylesheet" href="css/css2/login.css">
</head>
<body>
    <!-- <img src="images/main-folder/loginBg.jpg" alt=""> -->
     <!-- <img src="images/main-folder/loginBg.jpg" alt=""> -->
    <div class="main-container">
        <div class="row form-container">
            <div class="col-md-6">
                <div class="logo">
                    <!-- <img src="/assets/images/registerLogo.png" alt=""> -->
                    <img src="images/login-logo.png" alt="">
                </div>
                <form class="login-form">
                    <label>Mobile Number</label>
                    <input type="number" placeholder="Mobile Number">
                    <label>Password</label>
                    <input type="password" placeholder="Password">
                    <div class="login-btn mt-4">
                        <button class="btn text-center">Login</button>
                    </div> 
                    <div class="forgot">
                        <a href="">Create Account</a>
                        <a href="">Forgot Password?</a>
                    </div>
                </form>
            </div>
            <div class="col-md-6 image-container">
                <!-- <img src="/assets/images/rechargeBgLogin.png" alt=""> -->
                <img src="images/main-folder/rechargeBgLogin.png" alt="">
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
